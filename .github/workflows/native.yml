name: native-target-gates

on:
  workflow_dispatch:

jobs:
  webkitgtk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: xvfb-run -a python scripts/native_gate.py webkitgtk --execute --output evidence/native-webkitgtk.json
      - run: cargo build -p browser-workbench-webkitgtk-worker --no-default-features --features native
      # A compile gate is not evidence of a session; this executes one.
      - run: xvfb-run -a python scripts/native_e2e.py --output evidence/native-slice1
      # The whole denominator on a real engine: 12 scenarios x 3 repetitions.
      - run: xvfb-run -a python scripts/native_corpus.py --output evidence/native-corpus
      - run: xvfb-run -a python scripts/native_corpus.py --variant stable-persistent --output evidence/native-corpus-persistent
      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence
          path: |
            evidence/native-slice1
            evidence/native-corpus
            evidence/native-corpus-persistent

  playwright-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "24"}
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: npm ci
        working-directory: oracle/playwright
      - run: npx playwright install --with-deps webkit
        working-directory: oracle/playwright
      # Launching the browser, not merely resolving the package: an installed
      # oracle is not a runnable oracle.
      - run: xvfb-run -a node oracle/playwright/probe.mjs --launch
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev xvfb
      - run: cargo build -p browser-workbench-webkitgtk-worker --no-default-features --features native
      - run: xvfb-run -a python scripts/oracle_differential.py --oracle-runner local --output evidence/oracle-differential
      - uses: actions/upload-artifact@v4
        with: {name: oracle-differential-evidence, path: evidence/oracle-differential}

  servo-gtk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev xvfb
      - run: git clone https://github.com/nacho/servo-gtk /tmp/servo-gtk
      - run: git -C /tmp/servo-gtk checkout d366e11a41e042cc08f94004f28dba67f83b11a5
      - run: SERVO_GTK_SOURCE=/tmp/servo-gtk xvfb-run -a python scripts/native_gate.py servo-gtk --execute --output evidence/native-servo-gtk.json
