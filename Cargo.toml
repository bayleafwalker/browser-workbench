[workspace]
members = [
  "native/gtk-shell",
  "native/webkitgtk-worker",
  "native/servo-gtk-worker"
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "=1.0.99"
gio = "=0.21.2"
glib = "=0.21.3"
gtk = { package = "gtk4", version = "=0.11.4" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
webkit6 = { version = "=0.6.1", features = ["v2_52"] }
